<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fire Castle - Jake's Perfect Sandwich</title>
<link rel="stylesheet" href="style.css">
<style>
    body .menu-btn, 
    body .reset-btn, 
    body .nav-arrow-right, 
    body .nav-arrow-left {
        background-color: rgba(60, 15, 10, 0.9);
        color: #ffb347;
        border: 2px dashed #ff4500;
    }

    body .menu-btn:hover, 
    body .reset-btn:hover, 
    body .nav-arrow-right:hover, 
    body .nav-arrow-left:hover {
        background-color: #ff4500;
        color: #000;
    }
    .enter-castle-btn {
        position: absolute;
        top: 85%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-color: rgba(60, 15, 10, 0.85);
        color: #ffb347;
        border: 3px solid #ff4500;
        padding: 14px 28px;
        font-family: inherit;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        border-radius: 12px;
        z-index: 10;
        box-shadow: 0 0 15px rgba(255, 69, 0, 0.6);
        transition: background-color 0.2s, transform 0.2s, box-shadow 0.2s;
    }

    .enter-castle-btn:hover {
        background-color: rgba(90, 25, 15, 0.95);
        transform: translate(-50%, -50%) scale(1.08);
        box-shadow: 0 0 22px rgba(255, 69, 0, 0.9);
        color: #fff;
    }
</style>
</head>
<body>

<div id="fade-overlay" class="active"></div>

<button class="menu-btn" onclick="toggleMenu()">Sandwich Checklist</button>
<button class="reset-btn" onclick="localStorage.clear(); location.reload();">Reset Ingredients</button>

<div id="checklist-modal" class="checklist-modal">
    <div class="checklist-content">
        <h2>Jake's Sandwich Ingredients</h2>
        <ul id="ingredient-list"></ul>
        <button class="close-menu-btn" onclick="toggleMenu()">Close</button>
    </div>
</div>

<div class="screen active room-screen">
    <img src="firecastle.png" alt="Fire Castle" class="room-bg">
    <button class="nav-arrow-left" onclick="goToPage('firefood.html')">⬅</button>
    <button class="enter-castle-btn" onclick="goToPage('firekingdom.html')">leave fire castle</button>
</div>

<script src="treehouse.js"></script>
</body>
</html>
