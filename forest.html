<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forest - Jake's Perfect Sandwich</title>
<link rel="stylesheet" href="style.css">
<style>
    body .menu-btn, 
    body .reset-btn, 
    body .nav-arrow-right, 
    body .nav-arrow-left {
        background-color: rgba(40, 20, 50, 0.9);
        color: #e6b8ff;
        border: 2px dashed #8a2be2;
    }

    body .menu-btn:hover, 
    body .reset-btn:hover, 
    body .nav-arrow-right:hover, 
    body .nav-arrow-left:hover {
        background-color: #8a2be2;
        color: #fff;
    }

    .enter-cave-btn {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-color: rgba(40, 20, 50, 0.85);
        color: #e6b8ff;
        border: 3px solid #8a2be2;
        padding: 14px 28px;
        font-family: inherit;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        border-radius: 12px;
        z-index: 10;
        box-shadow: 0 0 15px rgba(138, 43, 226, 0.6);
        transition: background-color 0.2s, transform 0.2s, box-shadow 0.2s;
    }

    .enter-cave-btn:hover {
        background-color: rgba(70, 30, 90, 0.95);
        transform: translate(-50%, -50%) scale(1.08);
        box-shadow: 0 0 22px rgba(138, 43, 226, 0.9);
        color: #fff;
    }
</style>
</head>
<body>

<div id="fade-overlay" class="active"></div>

<button class="menu-btn" onclick="toggleMenu()">Sandwich Checklist</button>
<button class="reset-btn" onclick="localStorage.clear(); location.reload();">Reset Ingredients</button>

<div id="checklist-modal" class="checklist-modal">
    <div class="checklist-content">
        <h2>Jake's Sandwich Ingredients</h2>
        <ul id="ingredient-list"></ul>
        <button class="close-menu-btn" onclick="toggleMenu()">Close</button>
    </div>
</div>

<div class="screen active room-screen">
    <img src="forest.jfif" alt="Forest" class="room-bg">
    <button class="enter-cave-btn" onclick="goToPage('marcyshouse.html')">enter marceline's cave</button>
    <button class="nav-arrow-right" onclick="goToPage('fireforest.html')">➡</button>
    <button class="nav-arrow-left" onclick="goToPage('grassforest.html')">⬅</button>
</div>

<script src="treehouse.js"></script>
</body>
</html>
