<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candy Window View - Jake's Perfect Sandwich</title>
<link rel="stylesheet" href="style.css">
<style>
    body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: black;
    }

    .room-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: #000;
    }

    .room-bg {
        position: absolute;
        top: 50%;
        left: 50%;
        min-width: 100%;
        min-height: 100%;
        width: auto;
        height: auto;
        transform: translate(-50%, -50%) ;
        object-fit: contain !important;
        z-index: -1;
    }

    .back-btn {
        position: absolute;
        top: 83%;
        left: 50%;
        transform: translateX(-50%);
        padding: 12px 24px;
        font-family: inherit;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        border-radius: 8px;
        z-index: 10;
        background-color: rgba(60, 10, 30, 0.9);
        color: #ffb6c1;
        border: 2px solid #ff69b4;
        box-shadow: 0 0 10px rgba(255, 105, 180, 0.5);
        transition: background-color 0.2s, transform 0.2s, box-shadow 0.2s;
    }

    .back-btn:hover {
        background-color: rgba(90, 20, 45, 0.95);
        color: #fff;
        transform: translateX(-50%) scale(1.05);
        box-shadow: 0 0 15px rgba(255, 105, 180, 0.8);
    }

    .rock-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 5;
    }

    .rock-btn {
        position: absolute;
        background-color: transparent;
        border: none;
        border-radius: 50%;
        cursor: pointer;
        pointer-events: auto;
        transition: background-color 0.15s ease;
    }

    .rock-btn:hover {
        background-color: rgba(255, 105, 180, 0.15);
    }

    .rock-btn.glow {
        background-color: rgba(255, 105, 180, 0.5) !important;
        box-shadow: 0 0 15px #ff69b4;
    }

    .rock-btn.wrong {
        background-color: rgba(255, 0, 0, 0.4) !important;
    }

    .candy-modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(0, 0, 0, 0.7);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 100;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
    }

    .candy-modal.active {
        opacity: 1;
        pointer-events: auto;
    }

    .candy-modal-content {
        background-color: #ffe4e1;
        border: 4px solid #ff69b4;
        border-radius: 16px;
        padding: 30px;
        text-align: center;
        box-shadow: 0 0 25px #ff69b4;
        max-width: 380px;
    }

    .candy-modal-content h3 {
        color: #c71585;
        margin-top: 0;
        font-size: 24px;
    }

    .candy-modal-content p {
        color: #4a0e2e;
        font-size: 15px;
        margin-bottom: 20px;
        line-height: 1.4;
    }

    .candy-modal-btn {
        background-color: #ff69b4;
        color: white;
        border: none;
        padding: 10px 20px;
        font-size: 16px;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 4px #c71585;
        transition: transform 0.1s, box-shadow 0.1s;
    }

    .candy-modal-btn:active {
        transform: translateY(4px);
        box-shadow: 0 0 #c71585;
    }
</style>
</head>
<body>

<div id="fade-overlay" class="active"></div>

<div class="screen active room-screen">
    <img src="window.png" alt="Window View" class="room-bg">

    <div class="rock-container">
        <button class="rock-btn" id="rock-1" style="top: 76%; left: 83%; width: 100px; height: 60px;" onclick="handleRockClick(1)"></button>
        <button class="rock-btn" id="rock-2" style="top: 38%; left: 15%; width: 9%; height: 10.3%;" onclick="handleRockClick(2)"></button>
        <button class="rock-btn" id="rock-3" style="top: 24%; left: 73%; width: 85px; height: 53px;" onclick="handleRockClick(3)"></button>
        <button class="rock-btn" id="rock-4" style="top: 35%; left: 82%; width: 90px; height: 50px;" onclick="handleRockClick(4)"></button>
        <button class="rock-btn" id="rock-5" style="top: 47%; left: 23.5%; width: 9%; height: 7.5%;" onclick="handleRockClick(5)"></button>
        <button class="rock-btn" id="rock-6" style="top: 76%; left: 19.5%; width: 7.5%; height: 10.2%;" onclick="handleRockClick(6)"></button>
        <button class="rock-btn" id="rock-7" style="top: 14%; left: 22.35%; width: 7.5%; height: 7.5%;" onclick="handleRockClick(7)"></button>
        <button class="rock-btn" id="rock-8" style="top: 12.7%; left: 75%; width: 7%; height: 9%;" onclick="handleRockClick(8)"></button>
        <button class="rock-btn" id="rock-9" style="top: 9%; left: 8%; width: 7%; height: 7.8%;" onclick="handleRockClick(9)"></button>
        <button class="rock-btn" id="rock-10" style="top: 67%; left: 73%; width: 57px; height: 42px;" onclick="handleRockClick(10)"></button>
    </div>

    <button class="back-btn" onclick="goToPage('candybedroom.html')">leave window</button>
</div>

<div id="puzzle-modal" class="candy-modal">
    <div class="candy-modal-content">
        <h3>SECURITY SYSTEM</h3>
        <p>Identity confirmed: <strong>Princess Bubblegum</strong>. Welcome back to the laboratory, Your Highness!</p>
        <button class="candy-modal-btn" onclick="goToPage('candylab.html')">enter secret lab</button>
    </div>
</div>

<script src="treehouse.js"></script>
</body>
</html>
