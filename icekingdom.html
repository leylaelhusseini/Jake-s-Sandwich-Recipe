<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ice Kingdom - Jake's Perfect Sandwich</title>
<link rel="stylesheet" href="style.css">
<style>
    .leave-kingdom-btn {
    top: 50%;
    left: 3%;
    transform: translateY(-50%);
}

.leave-kingdom-btn:hover {
    transform: translateY(-50%) scale(1.05);
}
</style>
</head>
<body class="ice-theme">

<div id="fade-overlay" class="active"></div>

<button class="menu-btn" onclick="toggleMenu()">Sandwich Checklist</button>
<button class="reset-btn" onclick="localStorage.clear(); location.reload();">Reset Ingredients</button>

<div id="checklist-modal" class="checklist-modal">
    <div class="checklist-content">
        <h2>Jake's Sandwich Ingredients</h2>
        <ul id="ingredient-list"></ul>
        <button class="close-menu-btn" onclick="toggleMenu()">Close</button>
    </div>
</div>

<div class="screen active room-screen">
    <img src="icekingdom.jfif" alt="Ice Kingdom" class="room-bg">

    <button class="ice-castle-btn" onclick="goToPage('iceentrance.html')">enter Ice Castle</button>
    <button class="nav-arrow-right" onclick="goToPage('grassland2.html')">➡</button>
    <button class="nav-arrow-left" onclick="goToPage('icecandy.html')">⬅</button>
    
</div>

<script src="treehouse.js"></script>
</body>
</html>
