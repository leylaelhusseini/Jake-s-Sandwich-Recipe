<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Living Room - Jake's Perfect Sandwich</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="fade-overlay" class="active"></div>

<button class="menu-btn" onclick="toggleMenu()">Sandwich Checklist</button>
<button class="reset-btn" onclick="localStorage.clear(); location.reload();">Reset Ingredients</button>

<div id="checklist-modal" class="checklist-modal">
    <div class="checklist-content">
        <h2>Jake's Sandwich Ingredients</h2>
        <ul id="ingredient-list"></ul>
        <button class="close-menu-btn" onclick="toggleMenu()">Close</button>
    </div>
</div>

<div class="screen active room-screen">
    <img src="livingroom.png" alt="Living Room" class="room-bg">
    
    <img src="eggs.png" alt="Boiled Eggs" class="collectible-item" id="item-egg1" style="top:55%; left:48%; width:70px;" onclick="collectItem('eggs', this)">
    <img src="eggs.png" alt="Boiled Eggs" class="collectible-item" id="item-egg2" style="top:26%; left:68%; width:20px;" onclick="collectItem('eggs', this)">

    <button class="nav-arrow-left" onclick="goToPage('bedroom.html')">⬅</button>
    <button class="nav-arrow-right" onclick="goToPage('kitchen.html')">➡</button>
    <button class="leave-treehouse-btn" onclick="goToPage('grasslands.html')">Leave Treehouse</button>
</div>

<script src="treehouse.js"></script>
</body>
</html>
