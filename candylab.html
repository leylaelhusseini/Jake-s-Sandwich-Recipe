<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Lab - Jake's Perfect Sandwich</title>
<link rel="stylesheet" href="style.css">
<style>
    body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: black;
    }

    .room-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: #000;
    }

    .room-bg {
        position: absolute;
        top: 50%;
        left: 50%;
        min-width: 100%;
        min-height: 100%;
        width: auto;
        height: auto;
        transform: translate(-50%, -50%) ;
        object-fit: contain !important;
        z-index: -1;
    }

    .back-btn {
        position: absolute;
        top: 83%;
        left: 50%;
        transform: translateX(-50%);
        padding: 12px 24px;
        font-family: inherit;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        border-radius: 8px;
        z-index: 10;
        background-color: rgba(60, 10, 30, 0.9);
        color: #ffb6c1;
        border: 2px solid #ff69b4;
        box-shadow: 0 0 10px rgba(255, 105, 180, 0.5);
        transition: background-color 0.2s, transform 0.2s, box-shadow 0.2s;
    }

    .back-btn:hover {
        background-color: rgba(90, 20, 45, 0.95);
        color: #fff;
        transform: translateX(-50%) scale(1.05);
        box-shadow: 0 0 15px rgba(255, 105, 180, 0.8);
    }

    @keyframes floatAnim {
        0% {
            transform: translate(-50%, -50%) translateY(0px);
        }
        50% {
            transform: translate(-50%, -50%) translateY(-8px);
        }
        100% {
            transform: translate(-50%, -50%) translateY(0px);
        }
    }

    .collectible {
        position: absolute;
        cursor: pointer;
        transform: translate(-50%, -50%);
        transition: opacity 0.3s, filter 0.3s;
        z-index: 6;
        filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.9));
        animation: floatAnim 3s ease-in-out infinite;
    }

    .collectible:hover {
        animation-play-state: paused;
        transform: translate(-50%, -50%) scale(1.15) translateY(-4px);
        filter: drop-shadow(0 0 15px #ff69b4);
    }

    .ui-btn {
        position: absolute;
        padding: 10px 18px;
        font-family: inherit;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        border-radius: 8px;
        z-index: 10;
        background-color: rgba(60, 10, 30, 0.9);
        color: #ffb6c1;
        border: 2px solid #ff69b4;
        box-shadow: 0 0 10px rgba(255, 105, 180, 0.5);
        transition: background-color 0.2s, transform 0.2s, box-shadow 0.2s;
    }

    .ui-btn:hover {
        background-color: rgba(90, 20, 45, 0.95);
        color: #fff;
        transform: scale(1.05);
        box-shadow: 0 0 15px rgba(255, 105, 180, 0.8);
    }

    #checklist-btn {
        top: 20px;
        right: 20px;
    }

    #reset-btn {
        top: 20px;
        left: 20px;
    }

    .checklist-modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(0, 0, 0, 0.7);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 100;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
    }

    .checklist-modal.active {
        opacity: 1;
        pointer-events: auto;
    }

    .checklist-content {
        background-color: #ffe4e1;
        border: 4px solid #ff69b4;
        border-radius: 16px;
        padding: 25px;
        width: 320px;
        box-shadow: 0 0 25px #ff69b4;
        text-align: center;
    }

    .checklist-content h3 {
        color: #c71585;
        margin-top: 0;
    }

    .checklist-content ul {
        list-style: none;
        padding: 0;
        margin: 15px 0;
        max-height: 250px;
        overflow-y: auto;
        text-align: left;
    }

    .checklist-content li {
        font-size: 14px;
        margin-bottom: 8px;
        padding: 4px 8px;
        border-radius: 4px;
    }

    .item-collected {
        color: #006400;
        background-color: rgba(0, 128, 0, 0.1);
        text-decoration: line-through;
    }

    .item-missing {
        color: #8b0000;
        background-color: rgba(139, 0, 0, 0.1);
    }

    .close-modal-btn {
        background-color: #ff69b4;
        color: white;
        border: none;
        padding: 8px 16px;
        font-size: 14px;
        font-weight: bold;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 0 3px #c71585;
    }

    .close-modal-btn:active {
        transform: translateY(3px);
        box-shadow: 0 0 #c71585;
    }
</style>
</head>
<body>

<div id="fade-overlay" class="active"></div>

<div class="screen active room-screen">
    <img src="candylab.png" alt="Candy Lab" class="room-bg">

    <button id="reset-btn" class="ui-btn" onclick="resetInventory()">Reset Inventory</button>
    <button id="checklist-btn" class="ui-btn" onclick="toggleMenu()">Checklist</button>

    <img src="tomato.png" alt="Tomato" id="item-tomato" class="collectible" style="top: 55%; left: 60%; width: 60px;" onclick="collectItem('tomato', this)">

    <button class="back-btn" onclick="goToPage('window.html')">leave secret lab</button>
</div>

<div id="checklist-modal" class="checklist-modal">
    <div class="checklist-content">
        <h3>Sandwich Ingredients</h3>
        <ul id="ingredient-list"></ul>
        <button class="close-modal-btn" onclick="toggleMenu()">Close</button>
    </div>
</div>

<script src="treehouse.js"></script>
<script>
    function resetInventory() {
        playerInventory = [];
        localStorage.removeItem('sandwichInventory');
        location.reload();
    }
</script>
</body>
</html>
