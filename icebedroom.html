<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ice Bedroom - Jake's Perfect Sandwich</title>
<link rel="stylesheet" href="style.css">
<style>
    .room-bg {
        transform: translate(-50%, -50%) scale(1.08);
        transform-origin: center;
    }

    .enter-bathroom-btn {
        position: absolute;
        top: 90%;
        left: 90%;
        transform: translate(-50%, -50%);
        background-color: rgba(10, 30, 60, 0.8);
        color: #e0f7ff;
        border: 2px solid #00bfff;
        padding: 8px 16px;
        font-family: inherit;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        border-radius: 8px;
        z-index: 10;
        box-shadow: 0 0 10px rgba(0, 191, 255, 0.5);
        transition: background-color 0.2s, transform 0.2s, box-shadow 0.2s;
    }

    .enter-bathroom-btn:hover {
        background-color: rgba(20, 60, 100, 0.9);
        transform: translate(-50%, -50%) scale(1.05);
        box-shadow: 0 0 15px rgba(0, 191, 255, 0.8);
    }
</style>
</head>
<body class="ice-theme">

<div id="fade-overlay" class="active"></div>

<button class="menu-btn" onclick="toggleMenu()">Sandwich Checklist</button>
<button class="reset-btn" onclick="localStorage.clear(); location.reload();">Reset Ingredients</button>

<div id="checklist-modal" class="checklist-modal">
    <div class="checklist-content">
        <h2>Jake's Sandwich Ingredients</h2>
        <ul id="ingredient-list"></ul>
        <button class="close-menu-btn" onclick="toggleMenu()">Close</button>
    </div>
</div>

<div class="screen active room-screen">
    <img src="icebedroom.png" alt="Ice Bedroom" class="room-bg">

    <button class="enter-bathroom-btn" onclick="goToPage('icebathroom.html')">Enter Bathroom ➡</button>

    <button class="nav-arrow-left" onclick="goToPage('icecorridor.html')">⬅</button>
</div>

<script src="treehouse.js"></script>
</body>
</html>
