<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ice Fridge - Jake's Perfect Sandwich</title>
<link rel="stylesheet" href="style.css">
<style>
    .room-bg {
        transform: translate(-50%, -50%) scale(1.08);
        transform-origin: center;
    }

    .meat-item {
        position: absolute;
        top: 83%;
        left: 33%;
        transform: translate(-50%, -50%);
        width: 60px;
        cursor: pointer;
        z-index: 10;
        transition: transform 0.2s, filter 0.2s;
        filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.6));
    }

    .meat-item:hover {
        transform: translate(-50%, -50%) scale(1.1) rotate(3deg);
        filter: drop-shadow(0 0 12px rgba(255, 235, 59, 0.9));
    }

    .dill-item {
        position: absolute;
        top: 95%;
        left: 65%;
        transform: translate(-50%, -50%);
        width: 60px;
        cursor: pointer;
        z-index: 10;
        transition: transform 0.2s, filter 0.2s;
        filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.6));
    }

    .dill-item:hover {
        transform: translate(-50%, -50%) scale(1.1) rotate(3deg);
        filter: drop-shadow(0 0 12px rgba(255, 235, 59, 0.9));
    }

    .bacon-item {
        position: absolute;
        top: 90%;
        left: 75%;
        transform: translate(-50%, -50%);
        width: 90px;
        cursor: pointer;
        z-index: 10;
        transition: transform 0.2s, filter 0.2s;
        filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.6));
    }

    .bacon-item:hover {
        transform: translate(-50%, -50%) scale(1.1) rotate(3deg);
        filter: drop-shadow(0 0 12px rgba(255, 235, 59, 0.9));
    }
</style>
</head>
<body class="ice-theme">

<div id="fade-overlay" class="active"></div>

<button class="menu-btn" onclick="toggleMenu()">Sandwich Checklist</button>
<button class="reset-btn" onclick="localStorage.clear(); location.reload();">Reset Ingredients</button>

<div id="checklist-modal" class="checklist-modal">
    <div class="checklist-content">
        <h2>Jake's Sandwich Ingredients</h2>
        <ul id="ingredient-list"></ul>
        <button class="close-menu-btn" onclick="toggleMenu()">Close</button>
    </div>
</div>

<div class="screen active room-screen">
    <img src="icefridge.png" alt="Ice Fridge" class="room-bg">

    <img src="meat.png" alt="Meat" id="item-sousvide" class="meat-item" onclick="collectItem('sousvide', this)">
<img src="dill.png" alt="Dill" id="item-dill" class="dill-item" onclick="collectItem('dill', this)">
<img src="bacon.png" alt="Bacon" id="item-bacon" class="bacon-item" onclick="collectItem('bacon', this)">
    <button class="nav-arrow-left" onclick="goToPage('icekitchen.html')">⬅</button>
</div>

<script src="treehouse.js"></script>
</body>
</html>
