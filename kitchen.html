<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitchen - Jake's Perfect Sandwich</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="fade-overlay" class="active"></div>

<button class="menu-btn" onclick="toggleMenu()">Sandwich Checklist</button>
<button class="reset-btn" onclick="localStorage.clear(); location.reload();">Reset Ingredients</button>

<div id="checklist-modal" class="checklist-modal">
    <div class="checklist-content">
        <h2>Jake's Sandwich Ingredients</h2>
        <ul id="ingredient-list"></ul>
        <button class="close-menu-btn" onclick="toggleMenu()">Close</button>
    </div>
</div>

<div class="screen active room-screen">
    <img src="kitchen.png" alt="Kitchen" class="room-bg">
    
    <img src="bird.png" alt="Kitchen Bird" class="collectible-item cutout-item" id="item-bird" style="top:25%; left:60%; width:50px;" onclick="collectItem('bird', this)">
    <img src="cheese.png" alt="Cheese" class="collectible-item cutout-item" id="item-creamcheese" style="top:58%; left:55%; width:55px;" onclick="collectItem('creamcheese', this)">

    <button class="nav-arrow-left" onclick="goToPage('livingroom.html')">⬅</button>
    <button class="nav-arrow-right" onclick="goToPage('livingroom.html')">➡</button>
</div>

<script src="treehouse.js"></script>
</body>
</html>
