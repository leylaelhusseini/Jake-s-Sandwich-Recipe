<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ice Gym - Jake's Perfect Sandwich</title>
<link rel="stylesheet" href="style.css">
<style>
    .room-bg {
        transform: translate(-50%, -50%) scale(1.08);
        transform-origin: center;
    }

    .tears-item {
        position: absolute;
        top: 92%;
        left: 53%;
        transform: translate(-50%, -50%);
        width: 60px;
        cursor: pointer;
        z-index: 10;
        transition: transform 0.2s, filter 0.2s;
    }

    .tears-item:hover {
        transform: translate(-50%, -50%) scale(1.1);
        filter: drop-shadow(0 0 8px rgba(0, 191, 255, 0.8));
    }
</style>
</head>
<body class="ice-theme">

<div id="fade-overlay" class="active"></div>

<button class="menu-btn" onclick="toggleMenu()">Sandwich Checklist</button>
<button class="reset-btn" onclick="localStorage.clear(); location.reload();">Reset Ingredients</button>

<div id="checklist-modal" class="checklist-modal">
    <div class="checklist-content">
        <h2>Jake's Sandwich Ingredients</h2>
        <ul id="ingredient-list"></ul>
        <button class="close-menu-btn" onclick="toggleMenu()">Close</button>
    </div>
</div>

<div class="screen active room-screen">
    <img src="icegym.jfif" alt="Ice Gym" class="room-bg">

    <img src="tears.png" alt="Tears" class="tears-item" onclick="collectItem('tears', this)">

    <button class="nav-arrow-left" onclick="goToPage('iceentrance.html')">⬅</button>
</div>

<script src="treehouse.js"></script>
</body>
</html>
