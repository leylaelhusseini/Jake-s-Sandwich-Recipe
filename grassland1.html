<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grassland - Jake's Perfect Sandwich</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="fade-overlay" class="active"></div>

<button class="menu-btn" onclick="toggleMenu()">Sandwich Checklist</button>
<button class="reset-btn" onclick="localStorage.clear(); location.reload();">Reset Ingredients</button>

<div id="checklist-modal" class="checklist-modal">
    <div class="checklist-content">
        <h2>Jake's Sandwich Ingredients</h2>
        <ul id="ingredient-list"></ul>
        <button class="close-menu-btn" onclick="toggleMenu()">Close</button>
    </div>
</div>

<div class="screen active room-screen">
    <img src="grassland1.jfif" alt="Grassland" class="room-bg">
    
    <img src="cucumber.png" alt="Common Cucumber" class="collectible-item" id="item-cucumber" style="top:67%; left:68.2%; width:50px;" onclick="collectItem('cucumber', this)">

    <button class="nav-arrow-left" onclick="goToPage('grassland2.html')">⬅</button>
    <button class="nav-arrow-right" onclick="goToPage('grasslands.html')">➡</button>
<script src="treehouse.js"></script>
</body>
</html>
